<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Inventario de productos</h1>
</body>
<script>
    class Producto {
        constructor(codigo, nombre, cant, precio) {
            this.codigo = codigo;
            this.nombre = nombre;
            this.cant = cant;
            this.precio = precio;
        }

        info() {
            return `Codigo: ${this.codigo} Nombre: ${this.nombre} Cantidad: ${this.cant} Precio: ${this.precio}\n`;
        }
    }

    class Inventario {
        constructor() {
            this.inv = [];
        }

        agregar(p) {
            this.inv.push(p);
        }
        
        listar(){
            let datos="";
            for (let i = 0; i < this.inv.length; i++){
                datos += `${this.inv[i]}`;
            }
            return datos;
        }

        agregarInicio(p){
            for (let i = this.inv.length; i >= this.inv.length; i--){
                this.inv[i+1] = this.inv[i];
            }
            this.inv[0] = p;
        }

        eliminar(p){
            const aux = p;
            this.inv[p] = 0;
            for (let i = aux; i < this.inv.length; i++){
                this.inv[i] = this.inv[i+1];
            }
            this.inv.pop();
        }

        buscar(p) {
            for (let i = 0; i < this.inv.length; i++) {
                if (this.inv[i] === p) {
                    return this.inv[i];
                }
            }
            return null;
        }

        extraerPrimero(){
            this.inv[0] = 0;
            for (let i = 0; i < this.inv.length; i++){
                this.inv[i] = this.inv[i+1];
            }
            return this.inv.pop();
        }

    }

    let inventario=new Inventario();
    let nuevo=new Producto(1,"Lapiz",100,10); //hay 100 y cuestan 20
    inventario.agregar(nuevo);
    nuevo=new Producto(2,"Borrador",200,20); 
    inventario.agregar(nuevo);
    nuevo=new Producto(3,"Cuaderno",300,30);
    inventario.agregar(nuevo);
    nuevo=new Producto(4,"Clips",20,10); 
    inventario.agregarInicio(nuevo);
    nuevo=new Producto(5,"Sacapuntas",500,50); 
    inventario.agregar(nuevo);

    console.log(inventario.listar())

    inventario.eliminar(3);

    console.log(inventario.listar())

    let res=inventario.buscar(10);
    if (res==null)
        console.log("No existe");
    else
        console.log("si existe");

    res=inventario.buscar(4);
    if (res==null)
        console.log("No existe");
    else
        console.log(res.info());

    res=inventario.extraerPrimero();
    console.log("el primero es");
    console.log(res.info());
</script>
</html>
